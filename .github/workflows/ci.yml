name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar projeto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalação limpa
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npx --yes expo-doctor

      - name: Exportação web
        run: npx expo export --platform web
        env:
          CI: 1

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Só registra os alertas: os conhecidos estão documentados na issue #1.
      # Nunca usar `npm audit fix --force` (propõe downgrade para Expo 44).
      - name: npm audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/audit-summary.js audit.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: audit.json
          retention-days: 30
