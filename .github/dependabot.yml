version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Pacotes controlados pelo SDK do Expo: o SDK fixa a versão exata de cada
      # um e o Expo Doctor no CI reprova qualquer divergência, inclusive de
      # patch (ex.: react 19.2.3 -> 19.2.8). Eles só mudam com
      # `npx expo install --fix` ou na migração de SDK (issue #1, etapa 7).
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: jest-expo
      - dependency-name: eslint-config-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
      - dependency-name: react-native
      - dependency-name: react-native-*
      # Versões principais das ferramentas só depois de o Expo suportá-las
      # (ex.: eslint-config-expo 57 é para ESLint 9; jest-expo 57 para Jest 29).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: '@types/jest'
        update-types: [version-update:semver-major]
      - dependency-name: '@testing-library/react-native'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
